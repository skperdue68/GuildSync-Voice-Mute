version: '3'

# Shared build steps used by the per-platform Taskfiles. Packaging tasks are
# deliberately absent: releases ship a zip of the contents of bin/.
tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Installs frontend dependencies from the lockfile
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm is required: https://nodejs.org/en/download/"
    cmds:
      - npm ci

  generate:bindings:
    summary: Generates the frontend bindings from the Go service
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -clean=true -time-type=Date

  generate:icons:
    summary: Generates Windows `.ico` and macOS `.icns` from build/appicon.png
    run: once
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  build:frontend:
    summary: Builds the frontend bundle embedded in the binary
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run build

  dev:frontend:
    summary: Runs the Vite dev server that `wails3 dev` proxies to
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

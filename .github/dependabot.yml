version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      wails:
        patterns:
          - github.com/wailsapp/*
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  # The workflow pins its actions by tag, so they need the same weekly upkeep
  # as the module and package files.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

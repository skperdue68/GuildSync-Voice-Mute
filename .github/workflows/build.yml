name: Build and test companion
on:
  release:
    types: [published]
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: '1.26.x'
  WAILS_VERSION: 'v3.1.0'
jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p '*_test.py'
      - run: npm ci && npm test
        working-directory: frontend
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Compile and test
        run: |
          go build ./...
          go test ./...
  build:
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            universal: 'false'
          - os: macos-latest
            platform: macOS
            universal: 'true'
          - os: ubuntu-24.04
            platform: Linux
            universal: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: python tools/set-release-version.py "$RELEASE_TAG"
      - uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails 3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Go
        shell: bash
        run: go test ./...
      - name: Build executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          if [[ "${{ matrix.universal }}" == "true" ]]; then
            wails3 task darwin:build:universal
          else
            wails3 build
          fi
      - name: Package and validate version
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, zipfile
          config = pathlib.Path('build/config.yml').read_text()
          match = re.search(r'(?m)^  version:\s*"([^"]+)"', config)
          version = match.group(1) if match else ''
          frontend_version = json.loads(pathlib.Path('frontend/package.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version != frontend_version:
              raise SystemExit('App and frontend release versions must match (MAJOR.MINOR.PATCH).')
          if os.environ['GITHUB_REF_NAME'].removeprefix('v') != version:
              raise SystemExit('Release tag must match the app version.')
          windows = json.loads(pathlib.Path('build/windows/info.json').read_text())
          if windows['fixed']['product_version'] != version:
              raise SystemExit('Windows assembly metadata was not stamped.')
          plist = pathlib.Path('build/darwin/Info.plist').read_text()
          if f'<string>{version}</string>' not in plist:
              raise SystemExit('macOS bundle metadata was not stamped.')
          out = pathlib.Path('release'); out.mkdir(exist_ok=True)
          files = list(pathlib.Path('bin').rglob('*'))
          if not any(p.is_file() for p in files): raise SystemExit('No executable was built.')
          archive = out / f'GuildSync-Voice-Mute-{version}-{os.environ["PLATFORM_NAME"]}.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  if p.is_file(): z.write(p, p.relative_to('bin'))
              z.write('README.md'); z.write('docs/platform-support.md')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GuildSync-Voice-Mute-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber

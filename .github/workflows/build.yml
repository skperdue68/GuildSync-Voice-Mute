name: Build and test companion
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            args: ''
          - os: macos-latest
            platform: macOS
            args: '-platform darwin/universal'
          - os: ubuntu-24.04
            platform: Linux
            args: '-tags webkit2_41'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Go
        shell: bash
        run: go test ${{ matrix.args == '-tags webkit2_41' && '-tags webkit2_41' || '' }} ./...
      - name: Build executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: wails build ${{ matrix.args }}
      - name: Package and validate version
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, zipfile
          version = json.loads(pathlib.Path('wails.json').read_text())['info']['productVersion']
          frontend_version = json.loads(pathlib.Path('frontend/package.json').read_text())['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or version != frontend_version:
              raise SystemExit('App and frontend release versions must match (MAJOR.MINOR.PATCH).')
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Release tag must match the app version.')
          out = pathlib.Path('release'); out.mkdir(exist_ok=True)
          files = list(pathlib.Path('build/bin').rglob('*'))
          if not any(p.is_file() for p in files): raise SystemExit('No executable was built.')
          archive = out / f'GuildSync-Voice-Mute-{version}-{os.environ["PLATFORM_NAME"]}.zip'
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in files:
                  if p.is_file(): z.write(p, p.relative_to('build/bin'))
              z.write('README.md'); z.write('docs/platform-support.md')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GuildSync-Voice-Mute-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --title "GuildSync Voice Mute $RELEASE_TAG" --generate-notes

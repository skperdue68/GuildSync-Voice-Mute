name: Build and test companion
on:
  release:
    types: [published]
  pull_request:
  # A manual dispatch builds every platform and uploads the archives without
  # publishing anything; only a published release runs the release job.
  workflow_dispatch:
permissions:
  contents: read
env:
  GO_VERSION: '1.27.x'
  WAILS_VERSION: 'v3.1.0'
jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check product metadata is consistent
        run: python tools/check_product_metadata.py
      - run: python -m unittest discover -s tools -p '*_test.py'
      - run: npm ci && npm test
        working-directory: frontend
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      # govulncheck type-checks every package, so the GTK/WebKit headers the
      # Wails Linux build needs must be present even though nothing is built.
      - name: Install native dependencies for govulncheck
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Scan Go dependencies for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '${{ env.GO_VERSION }}'
          go-package: ./...
          repo-checkout: 'false'
          cache-dependency-path: go.sum
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The action reads the dependency diff and needs to comment on the pull
    # request that introduced it.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Reject pull requests that add a vulnerable dependency
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails 3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Check generated bindings are current
        shell: bash
        run: |
          # Reuse the build task so the flags cannot drift from a normal build.
          wails3 task -f common:generate:bindings
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git --no-pager diff -- frontend/bindings
            git status --short -- frontend/bindings
            echo "::error::frontend/bindings is stale. Run 'wails3 task common:generate:bindings' and commit the result."
            exit 1
          fi
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Compile and test
        run: |
          go build ./...
          go test ./...
  # The real installers are only built on a release. Run the release's own
  # build-installer-then-zip step on each native runner, so every packager and
  # the zip the updater downloads are proven by a pull request instead of by
  # the first release that needs them. Windows and macOS package a stub payload;
  # Linux builds the real application, because the AppImage bundler reads the
  # binary's linked libraries.
  installers:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - uses: actions/setup-go@v7
        if: runner.os == 'Linux'
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails 3 CLI
        if: runner.os == 'Linux'
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build frontend bundle
        if: runner.os == 'Linux'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build the application the AppImage bundles
        if: runner.os == 'Linux'
        shell: bash
        run: wails3 build
      - name: Build the installer zip and verify the copy inside it
        shell: bash
        run: python tools/smoke_installers.py ${{ matrix.platform }}
  build:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            universal: 'false'
          - os: macos-latest
            platform: macOS
            universal: 'true'
          - os: ubuntu-24.04
            platform: Linux
            universal: 'false'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stamp release version
        shell: bash
        run: |
          # A release stamps its tag. A dispatch stamps the committed version,
          # which exercises the stamping path without inventing a version.
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            python tools/set-release-version.py "${{ github.event.release.tag_name }}"
          else
            python tools/set-release-version.py "v$(python tools/check_product_metadata.py)"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails 3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Go
        shell: bash
        run: go test ./...
      - name: Build executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          if [[ "${{ matrix.universal }}" == "true" ]]; then
            wails3 task darwin:build:universal
          else
            wails3 build
          fi
      # The build writes a bare binary, so the .app bundle the installer packs
      # has to be assembled before it can be signed or turned into a .dmg.
      - name: Assemble the macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: wails3 task darwin:package
      - name: Ad-hoc sign macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: wails3 task darwin:codesign
      - name: Package release artifacts
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          VERSION="$(python tools/check_product_metadata.py)"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            python tools/check_product_metadata.py --expected "${{ github.event.release.tag_name }}"
          fi
          python tools/package_release.py "$PLATFORM_NAME" --version "v$VERSION"
      - name: Install Inno Setup
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the platform installer
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          VERSION="v$(python tools/check_product_metadata.py)"
          case "$PLATFORM_NAME" in
            Windows) python tools/package_installers.py windows --version "$VERSION" ;;
            macOS) python tools/package_installers.py macos --version "$VERSION" ;;
            # An AppImage carries the GTK/WebKitGTK runtime, so one file runs on
            # any distribution; it is still built for the runner's architecture,
            # which ends up in the name.
            Linux) python tools/package_installers.py linux --version "$VERSION" --arch "$(uname -m)" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: GuildSync-Voice-Mute-${{ matrix.platform }}
          # The installer ships next to the portable zip, so both are uploaded.
          path: release/*
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # The zips are what the in-app update downloads, and each one is written
      # straight after its installer, so nothing is published until all three
      # exist.
      - name: Check every platform produced an installer zip
        shell: bash
        run: |
          status=0
          for pattern in 'release/*-Windows-Setup.exe.zip' 'release/*-macOS.dmg.zip' 'release/*-Linux-*.AppImage.zip'; do
            if compgen -G "$pattern" > /dev/null; then
              echo "found $pattern"
            else
              echo "::error::no installer matches $pattern"
              status=1
            fi
          done
          ls -l release
          exit "$status"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber

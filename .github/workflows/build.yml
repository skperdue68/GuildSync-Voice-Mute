name: Build and test companion
on:
  # A tag is the release trigger. The build verifies every installer and only
  # then creates and publishes the release, so a version never becomes public
  # before its installers exist and nothing has to be replaced afterwards.
  push:
    tags: ['v*']
  pull_request:
  # A manual dispatch builds and verifies every platform without creating a
  # release, so the release path can be exercised without inventing a version.
  workflow_dispatch:
permissions:
  contents: read
env:
  GO_VERSION: '1.27.x'
  WAILS_VERSION: 'v3.1.0'
jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A package mirror that crawls must fail the job instead of counting
    # toward the six-hour default limit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check product metadata is consistent
        run: python tools/check_product_metadata.py
      - run: python -m unittest discover -s tools -p '*_test.py'
      - run: npm ci && npm test
        working-directory: frontend
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      # Point apt at Canonical's archive before it contacts the network; the
      # runner image ranks a regional mirror first, and tools/apt_mirrors.py
      # explains why it cannot wait until after `apt-get update`.
      - name: Point apt at the standard Ubuntu mirrors
        run: sudo python3 tools/apt_mirrors.py
      # govulncheck type-checks every package, so the GTK/WebKit headers the
      # Wails Linux build needs must be present even though nothing is built.
      - name: Install native dependencies for govulncheck
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Scan Go dependencies for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '${{ env.GO_VERSION }}'
          go-package: ./...
          repo-checkout: 'false'
          cache-dependency-path: go.sum
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The action reads the dependency diff and needs to comment on the pull
    # request that introduced it.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Reject pull requests that add a vulnerable dependency
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Point apt at the standard Ubuntu mirrors
        run: sudo python3 tools/apt_mirrors.py
      - name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails 3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Check generated bindings are current
        shell: bash
        run: |
          # Reuse the build task so the flags cannot drift from a normal build.
          wails3 task -f common:generate:bindings
          if [ -n "$(git status --porcelain -- frontend/bindings)" ]; then
            git --no-pager diff -- frontend/bindings
            git status --short -- frontend/bindings
            echo "::error::frontend/bindings is stale. Run 'wails3 task common:generate:bindings' and commit the result."
            exit 1
          fi
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Compile and test
        run: |
          go build ./...
          go test ./...
      # A release builds the AppImage on a tag. Bundle one here as well, so the
      # packager and the installer the in-app update downloads are proven on
      # every pull request instead of by the first release that needs them.
      - name: Build and verify the Linux installer
        shell: bash
        run: |
          wails3 build
          python tools/smoke_installers.py linux
  # The compile job only tests on Linux, so a failure that another platform alone
  # can produce (Windows cannot record a file mode, for one) went unnoticed until
  # the release build hit it. Run the same suite on the platforms a release also
  # builds, from the pull request that changed the code.
  native-test:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Go sources embed the bundle, so the tests do not compile until the
      # frontend has been built.
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test Go
        shell: bash
        run: go test ./...
  # The real installers are only built on a release. Run the release's own
  # build-installer step on a stub payload on each native runner, so the Windows
  # and macOS packagers and the installer the updater downloads are proven by a
  # pull request instead of by the first release that needs them. Linux is
  # covered by the compile job, which already has the toolchain and bundles the
  # application the AppImage needs.
  installers:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the installer and verify it
        shell: bash
        run: python tools/smoke_installers.py ${{ matrix.platform }}
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            universal: 'false'
          - os: macos-latest
            platform: macOS
            universal: 'true'
          - os: ubuntu-24.04
            platform: Linux
            universal: 'false'
    runs-on: ${{ matrix.os }}
    # The Linux leg is the one that installs packages, so it carries the
    # tightest limit: a crawling mirror fails in minutes, not in hours.
    timeout-minutes: ${{ matrix.platform == 'Linux' && 15 || 30 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stamp release version
        shell: bash
        run: |
          # A tag stamps that version. A dispatch stamps the committed version,
          # which exercises the stamping path without inventing a version.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python tools/set-release-version.py "${{ github.ref_name }}"
          else
            python tools/set-release-version.py "v$(python tools/check_product_metadata.py)"
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Point apt at the standard Ubuntu mirrors
        if: runner.os == 'Linux'
        run: sudo python3 tools/apt_mirrors.py
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - name: Install Wails 3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Go
        shell: bash
        run: go test ./...
      - name: Build executable
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          if [[ "${{ matrix.universal }}" == "true" ]]; then
            wails3 task darwin:build:universal
          else
            wails3 build
          fi
      # The build writes a bare binary, so the .app bundle the installer packs
      # has to be assembled before it can be signed or turned into a .dmg.
      - name: Assemble the macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: wails3 task darwin:package
      - name: Ad-hoc sign macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: wails3 task darwin:codesign
      - name: Package release artifacts
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          VERSION="$(python tools/check_product_metadata.py)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python tools/check_product_metadata.py --expected "${{ github.ref_name }}"
          fi
          python tools/package_release.py "$PLATFORM_NAME" --version "v$VERSION"
      - name: Install Inno Setup
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the platform installer
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: |
          VERSION="v$(python tools/check_product_metadata.py)"
          case "$PLATFORM_NAME" in
            Windows) python tools/package_installers.py windows --version "$VERSION" ;;
            macOS) python tools/package_installers.py macos --version "$VERSION" ;;
            # An AppImage carries the GTK/WebKitGTK runtime, so one file runs on
            # any distribution; it is still built for the runner's architecture,
            # which ends up in the name.
            Linux) python tools/package_installers.py linux --version "$VERSION" --arch "$(uname -m)" ;;
          esac
      # A release publishes only installers this checked on the platform that
      # built them: the setup is run silently, the disk image is mounted and the
      # AppImage is extracted, exactly as the pull-request smoke job does.
      - name: Verify the installer
        shell: bash
        env:
          PLATFORM_NAME: ${{ matrix.platform }}
        run: python tools/verify_release.py "$PLATFORM_NAME"
      # GitHub serves an artifact as a zip, so the installer is uploaded on its
      # own: unzipping the download leaves the installer and nothing else.
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: GuildSync-Voice-Mute-${{ matrix.platform }}-Installer
          path: |
            release/*-Windows-Setup.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
      # The portable archive is the other way to run the app, so it travels in
      # its own artifact instead of sitting beside the installer.
      - name: Upload the portable archive
        uses: actions/upload-artifact@v7
        with:
          name: GuildSync-Voice-Mute-${{ matrix.platform }}-Portable
          path: |
            release/*-Windows.zip
            release/*-macOS.zip
            release/*-Linux.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The installers carry a build-provenance attestation, which records the
      # workflow and commit that produced each file.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # The installers are what users download and what the in-app update
      # fetches, so nothing is published until all three exist.
      - name: Check every platform produced an installer
        shell: bash
        run: |
          status=0
          for pattern in 'release/*-Windows-Setup.exe' 'release/*-macOS.dmg' 'release/*-Linux-*.AppImage'; do
            if compgen -G "$pattern" > /dev/null; then
              echo "found $pattern"
            else
              echo "::error::no installer matches $pattern"
              status=1
            fi
          done
          ls -l release
          exit "$status"
      - name: Write the checksum manifest
        shell: bash
        run: |
          cd release
          # The manifest is written outside the glob, so it never hashes itself.
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Attest where the installers were built
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*-Windows-Setup.exe
            release/*-macOS.dmg
            release/*-Linux-*.AppImage
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A draft created by hand before the tag is reused, so its release
          # notes survive the build. A published release is never touched.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $TAG is already published; published assets are never replaced"
              exit 1
            fi
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
      # No --clobber: an upload that would replace a file fails instead, so the
      # bytes behind a version number cannot change after it is published.
      - name: Upload the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY"
      - name: Publish only the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          local="$(find release -maxdepth 1 -type f | wc -l)"
          remote="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$local" -ne "$remote" ]; then
            echo "::error::$TAG holds $remote of $local uploaded files; leaving it as a draft"
            exit 1
          fi
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

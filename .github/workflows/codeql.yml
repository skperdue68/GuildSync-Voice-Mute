name: CodeQL
# The default setup that GitHub generated for this repository analysed Go in
# autobuild mode on a stock runner. That runner has no GTK4/WebKitGTK headers, so
# the cgo build of Wails never ran and the extractor reported "could not import
# C" plus type errors in the dependency's generated bindings. This workflow
# installs the headers and builds with cgo, so the extraction sees real C types.
#
# Default setup is switched off in the repository settings, because GitHub
# refuses advanced-configuration SARIF uploads while it is on. It cannot be
# probed from here: reading the default-setup configuration needs
# "Administration: read", which a workflow token can never be granted, so a probe
# only ever sees 403 and would silently turn the scan off. If default setup is
# ever re-enabled, the upload below fails with GitHub's own explanation and that
# is the signal to switch it off again.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  # Lets the analysis be run by hand after a scanner or runner change without
  # pushing a commit.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - if: matrix.language == 'go'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.language == 'go'
        name: Point apt at the standard Ubuntu mirrors
        run: sudo python3 tools/apt_mirrors.py
      - if: matrix.language == 'go'
        name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: Build the bundle the Go code embeds
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - if: matrix.language == 'go'
        name: Build Go with cgo so the extractor gets C metadata
        run: go build ./...
      - uses: github/codeql-action/analyze@v4

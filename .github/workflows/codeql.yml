name: CodeQL
# Default setup runs Go in autobuild mode on a stock runner, which has no
# GTK4/WebKitGTK headers, so the cgo build of Wails never runs and the extractor
# reports "could not import C" plus type errors in the dependency's generated
# bindings. This workflow installs those headers and builds with cgo instead.
#
# GitHub refuses advanced-configuration SARIF uploads while default setup is
# enabled, so the analysis below stays idle until default setup is turned off in
# Settings -> Code security -> Code scanning. That keeps this workflow green
# rather than red for a configuration mismatch.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    outputs:
      enabled: ${{ steps.default-setup.outputs.enabled }}
    steps:
      - name: Check whether CodeQL default setup is still on
        id: default-setup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          state="$(gh api "repos/$REPOSITORY/code-scanning/default-setup" --jq .state 2>/dev/null || echo unknown)"
          if [ "$state" = "not-configured" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Default setup is off; running the advanced analysis."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CodeQL default setup reports '$state', so this workflow stays idle."
          fi
  analyze:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: go.sum
      - if: matrix.language == 'go'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.language == 'go'
        name: Install Wails Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: Build the bundle the Go code embeds
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - if: matrix.language == 'go'
        name: Build Go with cgo so the extractor gets C metadata
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
